<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Verification - StudyPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(99, 102, 241, 0.25); }
        #faceVideo { width: 100%; border-radius: 1.75rem; background: #0f172a; aspect-ratio: 4 / 3; object-fit: cover; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="panel w-full max-w-2xl rounded-[2.5rem] p-8 md:p-12 shadow-2xl">
        <p class="text-center text-[10px] uppercase tracking-[0.35em] text-indigo-400 font-black mb-3">Step 2 of 2</p>
        <h1 class="text-center text-3xl md:text-4xl font-black italic uppercase mb-4">Face Verification</h1>
        <p class="text-center text-slate-400 max-w-xl mx-auto mb-8">Your password is correct. Complete the webcam check to finish signing in.</p>
        <video id="faceVideo" autoplay muted playsinline></video>
        <p id="statusText" class="text-center text-xs font-bold uppercase tracking-widest mt-6 text-slate-400">Loading models...</p>
        <div class="mt-8 flex flex-col gap-4 md:flex-row">
            <button id="retryButton" class="flex-1 bg-white/5 border border-white/10 py-4 rounded-2xl font-black uppercase text-xs tracking-widest">Retry Scan</button>
            <button id="verifyButton" class="flex-1 bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl">Verify Face</button>
        </div>
    </div>

    <script>
        const FACE_MODEL_URL = '/models';
        const DETECTOR_OPTIONS = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.35 });
        const faceVideo = document.getElementById('faceVideo');
        const statusText = document.getElementById('statusText');
        const verifyButton = document.getElementById('verifyButton');
        let currentStream = null;

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function withTimeout(promise, ms, message) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
            ]);
        }

        async function ensureVideoReady(video) {
            if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
                return;
            }

            await new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => reject(new Error('Camera is not ready yet. Please retry.')), 8000);

                function cleanup() {
                    clearTimeout(timeoutId);
                    video.removeEventListener('loadedmetadata', onReady);
                    video.removeEventListener('canplay', onReady);
                }

                function onReady() {
                    cleanup();
                    resolve();
                }

                video.addEventListener('loadedmetadata', onReady, { once: true });
                video.addEventListener('canplay', onReady, { once: true });
            });
        }

        function captureFrame(video) {
            const canvas = document.createElement('canvas');
            const sourceWidth = video.videoWidth || 640;
            const sourceHeight = video.videoHeight || 480;
            const maxWidth = 480;
            const scale = Math.min(1, maxWidth / sourceWidth);
            canvas.width = Math.max(160, Math.round(sourceWidth * scale));
            canvas.height = Math.max(120, Math.round(sourceHeight * scale));
            const context = canvas.getContext('2d', { willReadFrequently: true });
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas;
        }

        async function detectFaceDescriptor(video) {
            await ensureVideoReady(video);

            for (let attempt = 0; attempt < 5; attempt += 1) {
                const frame = captureFrame(video);
                const detection = await withTimeout(
                    faceapi
                        .detectSingleFace(frame, DETECTOR_OPTIONS)
                        .withFaceLandmarks()
                        .withFaceDescriptor(),
                    12000,
                    'Face scan timed out. Move closer to the camera and improve lighting, then retry.'
                );

                if (detection) {
                    return detection;
                }

                statusText.textContent = 'Looking for a clear face... keep still and face the camera.';
                await wait(500);
            }

            return null;
        }

        async function loadModels() {
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
            ]);
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach((track) => track.stop());
            }

            currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            faceVideo.srcObject = currentStream;
            await faceVideo.play();
            await ensureVideoReady(faceVideo);
            statusText.textContent = 'Camera ready. Keep your face centered and press Verify Face.';
        }

        async function verifyFace() {
            statusText.textContent = 'Scanning...';
            verifyButton.disabled = true;
            verifyButton.textContent = 'Verifying...';

            try {
                const detection = await detectFaceDescriptor(faceVideo);

                if (!detection) {
                    throw new Error('No face detected. Try again in a brighter position.');
                }

                const response = await fetch('/verify-face-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ descriptor: Array.from(detection.descriptor) })
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'Face verification failed.');
                }

                statusText.textContent = 'Face verified. Opening dashboard...';
                window.location.href = '/dashboard.html';
            } catch (error) {
                statusText.textContent = error.message || 'Face verification failed.';
            } finally {
                verifyButton.disabled = false;
                verifyButton.textContent = 'Verify Face';
            }
        }

        document.getElementById('retryButton').addEventListener('click', startCamera);
        document.getElementById('verifyButton').addEventListener('click', verifyFace);

        (async function init() {
            try {
                await loadModels();
                await startCamera();
            } catch (error) {
                statusText.textContent = 'Could not load face verification. Please return to login.';
            }
        })();
    </script>
</body>
</html>
