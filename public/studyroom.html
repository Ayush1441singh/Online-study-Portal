<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyRoom Pro - Ultra Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0b0f1a; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Full Screen Share View */
        #screen-container { position: absolute; inset: 0; background: #000; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #screen-video { width: 92%; height: 82%; border-radius: 1.5rem; border: 1px solid #6366f1; box-shadow: 0 0 60px rgba(99, 102, 241, 0.25); }

        /* Draggable Camera Grid */
        #video-grid { position: absolute; top: 100px; right: 20px; width: 230px; z-index: 50; cursor: grab; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 10px; }
        video.camera-stream { width: 100%; border-radius: 1.2rem; border: 2px solid #6366f1; object-fit: cover; }

        /* Professional Toast Notification */
        #share-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #6366f1; padding: 1rem 2.5rem; border-radius: 3rem; z-index: 10000; transition: 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28); font-weight: 800; font-style: italic; box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        #share-toast.show { top: 40px; }

        /* Whiteboard */
        #whiteboardContainer { display: none; position: fixed; inset: 5%; background: white; z-index: 100; border-radius: 2.5rem; }
        
        /* 🔥 NEW PREMIUM AI PANEL STYLING 🔥 */
        #ai-panel { 
            display: flex; 
            flex-direction: column;
            position: fixed; 
            bottom: 100px; 
            right: 30px; 
            width: 340px; 
            height: 500px; 
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem; 
            z-index: 1000; 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
            /* Smooth slide-in animation */
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #ai-panel.ai-active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }
        
        /* Custom Scrollbar for AI chat */
        #ai-messages::-webkit-scrollbar { width: 4px; }
        #ai-messages::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="share-toast">📢 <span id="toast-msg">User is sharing screen...</span></div>

    <header class="p-4 bg-slate-900/95 flex justify-between items-center border-b border-white/5 z-20 shadow-2xl">
        <div class="flex items-center space-x-6">
            <button onclick="location.href='dashboard.html'" class="text-slate-400 hover:text-white transition font-bold uppercase tracking-widest text-[10px]">← EXIT</button>
            <h2 id="roomTitle" class="font-black italic text-indigo-400 uppercase tracking-[0.3em] text-lg">ROOM</h2>
        </div>
        <div class="flex space-x-2">
            <button id="vBtn" onclick="toggleVideo()" class="text-[9px] bg-white/5 px-4 py-2.5 rounded-full font-black uppercase tracking-widest hover:bg-indigo-600 transition">📸 CAMERA</button>
            <button id="mBtn" onclick="toggleMic()" class="text-[9px] bg-white/5 px-4 py-2.5 rounded-full font-black uppercase tracking-widest hover:bg-indigo-600 transition">🎤 VOICE</button>
            <button onclick="startScreenShare()" class="text-[9px] bg-indigo-600 px-5 py-2.5 rounded-full font-black uppercase shadow-lg shadow-indigo-500/20 active:scale-95 transition">🖥️ SHARE SCREEN</button>
            <button onclick="toggleWhiteboard()" class="text-[9px] bg-white/5 px-4 py-2.5 rounded-full font-black uppercase tracking-widest">🎨 BOARD</button>
            <button onclick="clearChat()" class="text-[9px] bg-red-500/10 text-red-500 px-4 py-2.5 rounded-full font-black border border-red-500/20 hover:bg-red-600 hover:text-white transition uppercase">🗑️ CLEAR</button>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        <div class="w-64 bg-slate-900/50 p-6 border-r border-white/5 overflow-y-auto hidden md:block">
            <h3 class="text-[9px] font-black text-indigo-400 mb-6 uppercase tracking-[0.2em] italic">Classmates</h3>
            <ul id="userList" class="space-y-3"></ul>
        </div>

        <div class="flex-1 flex flex-col relative">
            <div id="screen-container">
                <div class="mb-4 text-[10px] font-black text-indigo-400 uppercase tracking-[0.4em] bg-indigo-500/10 px-6 py-2.5 rounded-full border border-indigo-500/20">LIVE STREAM</div>
                <video id="screen-video" autoplay playsinline></video>
                <button onclick="stopScreenShare()" class="mt-6 bg-red-600 px-8 py-3 rounded-full font-black uppercase text-[10px] shadow-xl">STOP SHARING</button>
            </div>

            <div id="chatBox" class="flex-1 p-8 overflow-y-auto space-y-6 scroll-smooth"></div>

            <div id="video-grid">
                <p class="text-[8px] text-center opacity-30 font-black uppercase tracking-widest pb-1 border-b border-white/5">Local Handles</p>
            </div>
        </div>
    </div>

    <button onclick="toggleAI()" class="fixed bottom-8 right-8 w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 text-white shadow-[0_0_20px_rgba(99,102,241,0.5)] flex items-center justify-center text-2xl hover:scale-110 hover:shadow-[0_0_35px_rgba(99,102,241,0.8)] transition-all duration-300 z-[1001] group border border-white/10">
        <i class="fas fa-robot group-hover:rotate-12 transition-transform duration-300"></i>
    </button>

    <div id="ai-panel">
        <div class="p-4 bg-gradient-to-r from-indigo-900/50 to-purple-900/50 border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg"><i class="fas fa-magic text-xs"></i></div>
                <span class="font-black italic uppercase tracking-widest text-xs bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 to-purple-300">StudyAI Pro</span>
            </div>
            <button onclick="toggleAI()" class="text-slate-400 hover:text-white transition w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>
        
        <div id="ai-messages" class="flex-1 p-5 overflow-y-auto space-y-4 text-[11px] font-medium">
            <div class="text-center text-slate-500 text-[10px] uppercase tracking-widest my-4 opacity-50">AI Assistant Ready</div>
        </div>
        
        <div class="p-3 m-3 bg-black/40 border border-white/10 rounded-2xl flex items-center space-x-2">
            <input id="ai-input" placeholder="Ask AI a question..." autocomplete="off" class="flex-1 bg-transparent outline-none px-2 text-white placeholder-slate-500 text-[11px]">
            <button onclick="askAI()" class="bg-indigo-600 w-8 h-8 rounded-xl flex items-center justify-center hover:bg-indigo-500 transition shadow-lg"><i class="fas fa-paper-plane text-white text-[10px]"></i></button>
        </div>
    </div>

    <div id="whiteboardContainer">
        <div class="absolute top-6 right-6 flex space-x-4">
            <button onclick="clearWhiteboard()" class="bg-red-500 text-white px-8 py-2 rounded-2xl font-black text-xs uppercase shadow-xl">Clear</button>
            <button onclick="toggleWhiteboard()" class="bg-slate-800 text-white px-8 py-2 rounded-2xl font-black text-xs uppercase">Close</button>
        </div>
        <canvas id="wbCanvas" class="w-full h-full cursor-crosshair"></canvas>
    </div>

    <form id="chatForm" class="p-6 bg-slate-900 border-t border-white/5 flex items-center space-x-4 z-20">
        <label class="cursor-pointer text-slate-400 hover:text-indigo-500 transition px-2">
            <i class="fas fa-paperclip text-lg"></i>
            <input type="file" class="hidden">
        </label>
        <input id="messageInput" placeholder="Message your study buddies..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 transition text-sm">
        <button class="bg-indigo-600 px-10 py-4 rounded-2xl font-black italic uppercase tracking-widest text-white shadow-xl hover:scale-105 transition">Send</button>
    </form>

    <script>
    const socket = io();
    const username = localStorage.getItem('username');
    const room = new URLSearchParams(window.location.search).get('room');
    const myPeer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true }); 

    const videoGrid = document.getElementById('video-grid');
    const screenContainer = document.getElementById('screen-container');
    const screenVideo = document.getElementById('screen-video');
    const toast = document.getElementById('share-toast');

    let localStream, screenStream, isMicOn = true, isVideoOn = false;
    let myVideo = document.createElement('video');
    myVideo.muted = true; myVideo.className = "camera-stream";

    socket.emit('join room', { username, room });
    document.getElementById('roomTitle').textContent = room;

    function showToast(msg) {
        document.getElementById('toast-msg').textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // Draggable Logic
    let drag = false, ox, oy;
    videoGrid.onmousedown = e => { if(e.target.tagName==='VIDEO') return; drag=true; ox=e.clientX-videoGrid.offsetLeft; oy=e.clientY-videoGrid.offsetTop; };
    document.onmousemove = e => { if(drag){ videoGrid.style.left=(e.clientX-ox)+'px'; videoGrid.style.top=(e.clientY-oy)+'px'; videoGrid.style.right='auto'; } };
    document.onmouseup = () => drag=false;

    // --- PEER & MEDIA ---
    myPeer.on('call', call => {
        call.answer(localStream);
        call.on('stream', s => {
            if(call.metadata && call.metadata.type === 'screen') {
                screenContainer.style.display = 'flex';
                screenVideo.srcObject = s;
            } else {
                const v = document.createElement('video');
                v.className = "camera-stream";
                v.srcObject = s; v.play(); videoGrid.append(v);
            }
        });
    });

    socket.on('user-connected', userId => { if(localStream) connectToNewUser(userId, localStream); });

    async function toggleVideo() {
        if(!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            myVideo.srcObject = localStream;
            myVideo.play(); videoGrid.append(myVideo);
            socket.emit('user-joined-media', { userId: myPeer.id, room });
            isVideoOn = true;
            document.getElementById('vBtn').classList.add('bg-indigo-600');
        } else {
            localStream.getTracks().forEach(t => t.stop());
            myVideo.remove(); localStream = null; isVideoOn = false;
            document.getElementById('vBtn').classList.remove('bg-indigo-600');
        }
    }

    function toggleMic() {
        if(!localStream) return alert("Pehle camera on karo!");
        isMicOn = !isMicOn;
        localStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('mBtn').textContent = isMicOn ? "🎤 VOICE ON" : "🔇 MUTED";
        document.getElementById('mBtn').classList.toggle('bg-red-500', !isMicOn);
    }

    function connectToNewUser(userId, stream) {
        const call = myPeer.call(userId, stream);
        const v = document.createElement('video');
        v.className = "camera-stream";
        call.on('stream', s => { v.srcObject = s; v.play(); videoGrid.append(v); });
    }

    // --- SCREEN SHARE ---
    async function startScreenShare() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            screenContainer.style.display = 'flex';
            screenVideo.srcObject = screenStream;
            socket.emit('screen-share-start', { user: username, room });
            for(let id in myPeer.connections) { myPeer.call(id, screenStream, { metadata: { type: 'screen' } }); }
            screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
        } catch (e) { console.log(e); }
    }

    function stopScreenShare() {
        if(screenStream) screenStream.getTracks().forEach(t => t.stop());
        screenContainer.style.display = 'none';
        socket.emit('screen-share-stop', { user: username, room });
    }

    socket.on('notify-share-start', d => showToast(`${d.user} STARTING SCREEN SHARE!`));
    socket.on('notify-share-stop', d => { showToast(`${d.user} STOPPED SHARING.`); screenContainer.style.display = 'none'; });

    // --- CHAT & USERS ---
    socket.on('chat message', d => {
        const isMe = d.user === username;
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-6`;
        div.innerHTML = `<div class="${isMe ? 'bg-indigo-600 shadow-lg' : 'bg-slate-800'} p-4 rounded-2xl max-w-sm border border-white/5"><p class="text-[8px] font-black uppercase opacity-50 mb-1">${d.user}</p><p class="text-[13px]">${d.msg}</p></div>`;
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    });

    document.getElementById('chatForm').onsubmit = e => {
        e.preventDefault();
        const msg = document.getElementById('messageInput').value;
        if(msg.trim()) { socket.emit('chat message', { user: username, msg, room }); document.getElementById('messageInput').value = ''; }
    };

    socket.on('update user list', u => {
        document.getElementById('userList').innerHTML = u.map(x => `<li class="flex items-center space-x-3 bg-white/5 p-3 rounded-xl border border-white/5"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div><span class="text-[10px] font-black uppercase tracking-widest">${x.username}</span></li>`).join('');
    });

    socket.on('load history', h => h.forEach(d => { /* Load history */ }));

    async function clearChat() { if(confirm("Clear chat?")) { await fetch(`/clear-chat/${room}`, { method: 'DELETE' }); document.getElementById('chatBox').innerHTML = ''; } }

    // --- 🔥 NEW PRO AI LOGIC 🔥 ---
    function toggleAI() { 
        const p = document.getElementById('ai-panel'); 
        p.classList.toggle('ai-active');
    }
    
    // Send message on Enter key
    document.getElementById('ai-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') askAI();
    });

    async function askAI() {
        const i = document.getElementById('ai-input'), b = document.getElementById('ai-messages');
        const v = i.value; if(!v) return;
        
        // User Message Bubble
        b.innerHTML += `<div class="flex justify-end mb-3"><div class="bg-indigo-600 text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-[11px] shadow-md max-w-[85%]">${v}</div></div>`;
        i.value = "Thinking...";
        b.scrollTop = b.scrollHeight;

        try {
            const res = await fetch('/ask-ai', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt: v }) });
            const d = await res.json();
            
            // AI Response Bubble
            b.innerHTML += `<div class="flex justify-start mb-4"><div class="bg-slate-800/80 border border-indigo-500/30 text-slate-200 px-4 py-3 rounded-2xl rounded-tl-sm text-[11px] shadow-lg max-w-[90%] leading-relaxed"><i class="fas fa-sparkles text-indigo-400 mr-1"></i> ${d.answer}</div></div>`;
        } catch (err) {
            b.innerHTML += `<div class="flex justify-start mb-4"><div class="bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-2 rounded-2xl rounded-tl-sm text-[11px]">Server Error!</div></div>`;
        }
        i.value = ""; b.scrollTop = b.scrollHeight;
    }

    const canvas = document.getElementById('wbCanvas'); const ctx = canvas.getContext('2d');
    let drawing = false;
    function toggleWhiteboard() { const wb = document.getElementById('whiteboardContainer'); wb.style.display = wb.style.display==='block' ? 'none' : 'block'; if(wb.style.display==='block'){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;} }
    canvas.onmousedown = () => drawing = true; canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
    canvas.onmousemove = e => { if(!drawing) return; ctx.lineWidth=3; ctx.lineCap='round'; ctx.strokeStyle='#000'; ctx.lineTo(e.clientX-canvas.offsetLeft-(window.innerWidth*0.05), e.clientY-canvas.offsetTop-(window.innerHeight*0.05)); ctx.stroke(); };
    function clearWhiteboard() { ctx.clearRect(0,0,canvas.width,canvas.height); }
    </script>
</body>
</html>
