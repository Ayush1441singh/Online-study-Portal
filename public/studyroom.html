<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudyRoom Pro - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --accent: #6366f1; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* 🛠️ MOVABLE VIDEO GRID */
        #video-grid { 
            position: absolute; top: 100px; right: 20px; width: 240px; 
            z-index: 50; cursor: grab; background: rgba(0,0,0,0.4); 
            padding: 10px; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        #video-grid:active { cursor: grabbing; }
        video { width: 100%; height: 140px; border-radius: 1rem; border: 2px solid #6366f1; object-fit: cover; background: #000; transition: 0.3s; }
        video:fullscreen { object-fit: contain; border: none; }

        /* AI Panel */
        #ai-panel { display: none; position: fixed; bottom: 100px; right: 25px; width: 320px; height: 450px; background: #1e293b; border-radius: 20px; z-index: 1000; flex-direction: column; border: 1px solid #6366f1; overflow: hidden; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="p-4 bg-slate-900/95 flex justify-between items-center border-b border-white/5 z-10">
        <div class="flex items-center space-x-4">
            <button onclick="location.href='dashboard.html'" class="text-slate-400 hover:text-white transition">← Exit</button>
            <h2 id="roomTitle" class="font-black italic text-indigo-400 uppercase tracking-widest text-lg">ROOM</h2>
        </div>
        <div class="flex space-x-2">
            <button id="vBtn" onclick="toggleVideo()" class="text-[10px] bg-white/5 px-4 py-2 rounded-full font-bold hover:bg-indigo-600 transition">📹 VIDEO</button>
            <button id="micBtn" onclick="toggleMic()" class="text-[10px] bg-white/5 px-4 py-2 rounded-full font-bold hover:bg-indigo-600 transition">🎤 VOICE</button>
            <button onclick="startScreenShare()" class="text-[10px] bg-indigo-600 px-5 py-2 rounded-full font-black shadow-lg shadow-indigo-500/20 hover:scale-105 transition">🖥️ SHARE SCREEN</button>
            <button onclick="toggleWhiteboard()" class="text-[10px] bg-white/5 px-4 py-2 rounded-full font-bold">🎨 BOARD</button>
            <button onclick="clearChat()" class="text-[10px] bg-red-500/10 text-red-500 px-4 py-2 rounded-full font-bold border border-red-500/20 hover:bg-red-500 hover:text-white transition">🗑️ CLEAR CHAT</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <div class="w-64 bg-slate-900/50 p-6 border-r border-white/5 overflow-y-auto">
            <p class="text-[10px] font-black text-indigo-400 mb-6 uppercase tracking-widest italic">Live Classmates</p>
            <ul id="userList" class="space-y-3"></ul>
        </div>
        
        <div id="chatBox" class="flex-1 p-8 overflow-y-auto space-y-4 scroll-smooth"></div>

        <div id="video-grid" title="Hold to move me">
            <p class="text-[8px] text-center opacity-30 font-bold uppercase tracking-tighter mb-1">Drag Handle</p>
        </div>
    </div>

    <div onclick="toggleAI()" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center cursor-pointer shadow-2xl z-[1001] hover:scale-110 active:scale-90 transition">🤖</div>

    <div id="ai-panel" class="shadow-2xl">
        <div class="p-4 bg-indigo-600 font-bold flex justify-between items-center text-sm">
            <span>StudyAI Assistant</span>
            <button onclick="toggleAI()" class="opacity-70 hover:opacity-100">×</button>
        </div>
        <div id="ai-messages" class="flex-1 p-4 overflow-y-auto text-xs space-y-3 bg-slate-950"></div>
        <div class="p-3 bg-slate-900 flex space-x-2">
            <input id="ai-input" placeholder="Ask AI anything..." class="flex-1 bg-white/5 p-2 rounded-lg outline-none text-[11px] focus:border-indigo-500 border border-transparent">
            <button onclick="askAI()" class="text-indigo-400 font-black text-[11px] uppercase px-2">Ask</button>
        </div>
    </div>

    <div id="whiteboardContainer" class="fixed inset-10 bg-white z-[100] rounded-3xl hidden shadow-2xl overflow-hidden">
        <div class="absolute top-4 right-4 flex space-x-2">
            <button onclick="clearWhiteboard()" class="bg-red-500 text-white px-5 py-2 rounded-xl font-bold text-xs shadow-lg">Clear All</button>
            <button onclick="toggleWhiteboard()" class="bg-slate-800 text-white px-5 py-2 rounded-xl font-bold text-xs">Close</button>
        </div>
        <canvas id="wbCanvas" class="w-full h-full"></canvas>
    </div>

    <form id="chatForm" class="p-6 bg-slate-900/95 border-t border-white/5 flex items-center space-x-4">
        <input type="file" id="fileInput" class="hidden">
        <button type="button" onclick="document.getElementById('fileInput').click()" class="text-2xl opacity-40 hover:opacity-100 transition">📎</button>
        <input id="messageInput" placeholder="Send a message to everyone..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 transition">
        <button class="bg-indigo-600 px-10 py-4 rounded-2xl font-black text-white hover:bg-indigo-500 transition-all shadow-lg">SEND</button>
    </form>

    <script>
    const socket = io();
    const username = localStorage.getItem('username');
    const room = new URLSearchParams(window.location.search).get('room');
    
    // PeerJS Cloud for global signaling
    const myPeer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true }); 

    const videoGrid = document.getElementById('video-grid');
    let localStream, isVideoOn = false, isMicOn = false;
    let myVideo = document.createElement('video');
    myVideo.muted = true; myVideo.id = "my-local-camera";

    if(!username || !room) {
        location.href = 'dashboard.html';
    } else {
        document.getElementById('roomTitle').textContent = room;
        socket.emit('join room', { username, room });
    }

    // --- 🛠️ DRAGGABLE LOGIC ---
    let isDragging = false, offX, offY;
    videoGrid.onmousedown = e => {
        if(e.target.tagName === 'VIDEO') return; // Video ke upar drag na ho
        isDragging = true;
        offX = e.clientX - videoGrid.offsetLeft;
        offY = e.clientY - videoGrid.offsetTop;
    };
    document.onmousemove = e => {
        if (!isDragging) return;
        videoGrid.style.left = (e.clientX - offX) + 'px';
        videoGrid.style.top = (e.clientY - offY) + 'px';
        videoGrid.style.right = 'auto'; 
    };
    document.onmouseup = () => isDragging = false;

    // --- 📹 VIDEO & CALL LOGIC ---
    myPeer.on('call', call => {
        call.answer(localStream);
        const video = document.createElement('video');
        video.id = call.peer;
        call.on('stream', userStream => {
            if(!document.getElementById(call.peer)) addVideoStream(video, userStream);
        });
    });

    socket.on('user-connected', userId => {
        if(localStream) connectToNewUser(userId, localStream);
    });

    async function toggleVideo() {
        if(!isVideoOn) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                if(!isMicOn) localStream.getAudioTracks()[0].enabled = false;
                myVideo.srcObject = localStream;
                if(!document.getElementById('my-local-camera')) addVideoStream(myVideo, localStream);

                socket.emit('user-joined-media', { userId: myPeer.id, room });
                isVideoOn = true;
                document.getElementById('vBtn').textContent = "📽️ ON";
                document.getElementById('vBtn').classList.add('bg-indigo-600');
            } catch (err) { alert("Camera access denied!"); }
        } else {
            localStream.getTracks().forEach(t => t.stop());
            myVideo.remove(); isVideoOn = false;
            document.getElementById('vBtn').textContent = "📹 VIDEO";
            document.getElementById('vBtn').classList.remove('bg-indigo-600');
        }
    }

    function toggleMic() {
        if(!localStream) return alert("Pehle Video ON karo!");
        isMicOn = !isMicOn;
        localStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('micBtn').textContent = isMicOn ? "🎙️ ON" : "🎤 VOICE";
        document.getElementById('micBtn').classList.toggle('bg-green-600');
    }

    function addVideoStream(v, s) {
        v.srcObject = s;
        v.onloadedmetadata = () => v.play();
        // Double Click to Fullscreen
        v.ondblclick = () => {
            if(v.requestFullscreen) v.requestFullscreen();
            else if(v.webkitRequestFullscreen) v.webkitRequestFullscreen();
        };
        videoGrid.append(v);
    }

    function connectToNewUser(userId, stream) {
        const call = myPeer.call(userId, stream);
        const video = document.createElement('video');
        video.id = userId;
        call.on('stream', userStream => {
            if(!document.getElementById(userId)) addVideoStream(video, userStream);
        });
        call.on('close', () => video.remove());
    }

    // --- 🖥️ SCREEN SHARE (WITH SYSTEM AUDIO & POPUP) ---
    async function startScreenShare() {
        try {
            alert("Bhai, jab popup aaye toh 'Share System Audio' checkbox ko tick zaroor karna tabhi aawaz jayegi!");
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ 
                video: true, 
                audio: { echoCancellation: true, noiseSuppression: true } 
            });
            
            const vTrack = screenStream.getVideoTracks()[0];
            const aTrack = screenStream.getAudioTracks()[0];

            // Local Notification
            socket.emit('screen-share-start', { user: username, room });

            myVideo.srcObject = screenStream;
            myVideo.style.objectFit = "contain"; 
            myVideo.id = "screen-share-active";

            // Signaling: Replace tracks for everyone
            for (let id in myPeer.connections) {
                myPeer.connections[id].forEach(conn => {
                    const vSender = conn.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if(vSender) vSender.replaceTrack(vTrack);
                    if(aTrack) {
                        const aSender = conn.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                        if(aSender) aSender.replaceTrack(aTrack);
                    }
                });
            }

            vTrack.onended = () => {
                socket.emit('screen-share-stop', { user: username, room });
                location.reload(); // Hard reset for clean camera switch
            };
        } catch (e) { console.log("Share cancel"); }
    }

    socket.on('notify-share-start', data => {
        alert(`🔔 ALERT: ${data.user} ne Screen Share shuru kar diya hai!`);
    });

    socket.on('notify-share-stop', data => {
        alert(`${data.user} ka Screen Share khatam ho gaya.`);
        location.reload();
    });

    // --- 💬 CHAT & USER LIST ---
    socket.on('update user list', (users) => {
        document.getElementById('userList').innerHTML = users.map(u => `
            <li class="flex items-center space-x-3 text-[11px] font-bold bg-white/5 p-3 rounded-xl border border-white/5">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_green]"></div>
                <span>${u.username}</span>
            </li>`).join('');
    });

    function appendMsg(data) {
        const isMe = data.user === username;
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-4`;
        div.innerHTML = `
            <div class="${isMe ? 'bg-indigo-600 shadow-indigo-500/20' : 'glass'} p-4 rounded-2xl max-w-sm shadow-xl border border-white/5">
                <p class="text-[8px] font-black uppercase opacity-50 mb-1 tracking-widest">${data.user}</p>
                <p class="text-sm leading-relaxed">${data.msg}</p>
            </div>
        `;
        const cb = document.getElementById('chatBox');
        cb.appendChild(div);
        cb.scrollTop = cb.scrollHeight;
    }

    document.getElementById('chatForm').onsubmit = (e) => {
        e.preventDefault();
        const msg = document.getElementById('messageInput').value;
        if(msg.trim()) {
            socket.emit('chat message', { user: username, msg, room });
            document.getElementById('messageInput').value = '';
        }
    };
    socket.on('chat message', data => appendMsg(data));
    socket.on('load history', msgs => msgs.forEach(appendMsg));

    async function clearChat() {
        if(confirm("Bhai, poori history saaf kar doon?")) {
            await fetch(`/clear-chat/${room}`, { method: 'DELETE' });
            document.getElementById('chatBox').innerHTML = '';
        }
    }

    // --- 🎨 WHITEBOARD ---
    const canvas = document.getElementById('wbCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    function toggleWhiteboard() {
        const wb = document.getElementById('whiteboardContainer');
        wb.classList.toggle('hidden');
        if(!wb.classList.contains('hidden')) {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
    }
    canvas.onmousedown = () => drawing = true;
    canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
    canvas.onmousemove = e => {
        if(!drawing) return;
        ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
        ctx.lineTo(e.clientX - canvas.offsetLeft - (window.innerWidth*0.1), e.clientY - canvas.offsetTop - (window.innerHeight*0.1));
        ctx.stroke();
    };
    function clearWhiteboard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // --- 🤖 AI ASSISTANT ---
    function toggleAI() {
        const p = document.getElementById('ai-panel');
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }
    async function askAI() {
        const input = document.getElementById('ai-input');
        const box = document.getElementById('ai-messages');
        const val = input.value; if(!val) return;
        box.innerHTML += `<div class="bg-indigo-600/20 p-2 rounded-lg text-white mb-2 italic">You: ${val}</div>`;
        input.value = "Thinking...";
        const res = await fetch('/ask-ai', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ prompt: val }) 
        });
        const d = await res.json();
        box.innerHTML += `<div class="bg-slate-800 p-2 rounded-lg text-indigo-300 mb-2 border-l-2 border-indigo-500">AI: ${d.answer}</div>`;
        input.value = ""; box.scrollTop = box.scrollHeight;
    }
    </script>
</body>
</html>
