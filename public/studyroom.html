<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyRoom Pro - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0b0f1a; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #screen-container { position: absolute; inset: 0; background: #000; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #screen-video { width: 92%; height: 82%; border-radius: 1.5rem; border: 1px solid #6366f1; box-shadow: 0 0 60px rgba(99, 102, 241, 0.25); cursor: pointer; }

        #video-grid { position: absolute; top: 100px; right: 20px; width: 230px; z-index: 50; cursor: grab; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 10px; }
        video.camera-stream { width: 100%; border-radius: 1.2rem; border: 2px solid #6366f1; object-fit: cover; }

        #share-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #6366f1; padding: 1rem 2.5rem; border-radius: 3rem; z-index: 10000; transition: 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28); font-weight: 800; font-style: italic; box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4); text-transform: uppercase; }
        #share-toast.show { top: 40px; }

        #whiteboardContainer { display: none; position: fixed; inset: 5%; background: white; z-index: 100; border-radius: 2.5rem; box-shadow: 0 0 100px rgba(0,0,0,0.5); }
        
        #ai-panel { 
            display: flex; 
            flex-direction: column;
            position: fixed; 
            bottom: 100px; 
            right: 30px; 
            width: 340px; 
            height: 500px; 
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem; 
            z-index: 1000; 
            border: 1px solid rgba(99, 102, 241, 0.3); 
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #ai-panel.ai-active { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

        #fullscreen-btn {
            position: absolute;
            top: 80px;
            right: 60px;
            background: rgba(99,102,241,0.85);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 2rem;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        #fullscreen-btn:hover { background: #6366f1; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="share-toast">📢 <span id="toast-msg">User is sharing screen...</span></div>

    <header class="p-4 bg-slate-900/95 flex justify-between items-center border-b border-white/5 z-20 shadow-2xl">
        <div class="flex items-center space-x-6">
            <button onclick="location.href='dashboard.html'" class="text-slate-400 hover:text-white transition font-bold uppercase tracking-widest text-[10px]">← EXIT ROOM</button>
            <h2 id="roomTitle" class="font-black italic text-indigo-400 uppercase tracking-[0.3em] text-lg">ROOM</h2>
        </div>
        <div class="flex space-x-2">
            <button id="vBtn" onclick="toggleCamera()" class="text-[9px] bg-white/5 px-4 py-2.5 rounded-full font-black uppercase tracking-widest hover:bg-indigo-600 transition">📸 CAMERA</button>
            <button id="mBtn" onclick="toggleMic()" class="text-[9px] bg-white/5 px-4 py-2.5 rounded-full font-black uppercase tracking-widest hover:bg-indigo-600 transition">🎤 VOICE</button>
            <button onclick="startScreenShare()" class="text-[9px] bg-indigo-600 px-5 py-2.5 rounded-full font-black uppercase shadow-lg shadow-indigo-500/20 active:scale-95 transition">🖥️ SHARE SCREEN</button>
            <button onclick="toggleWhiteboard()" class="text-[9px] bg-white/5 px-4 py-2.5 rounded-full font-black uppercase tracking-widest">🎨 WHITEBOARD</button>
            <button onclick="clearChat()" class="text-[9px] bg-red-500/10 text-red-500 px-4 py-2.5 rounded-full font-black border border-red-500/20 hover:bg-red-600 hover:text-white transition uppercase">🗑️ CLEAR CHAT</button>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        
        <div class="w-64 bg-slate-900/50 p-6 border-r border-white/5 overflow-y-auto hidden md:block">
            <h3 class="text-[9px] font-black text-indigo-400 mb-6 uppercase tracking-[0.2em] italic underline underline-offset-8">Online Students</h3>
            <ul id="userList" class="space-y-3"></ul>
        </div>

        <div class="flex-1 flex flex-col relative">
            <div id="screen-container">
                <div class="mb-4 text-[10px] font-black text-indigo-400 uppercase tracking-[0.4em] bg-indigo-500/10 px-6 py-2.5 rounded-full border border-indigo-500/20">LIVE STREAMING</div>
                <video id="screen-video" autoplay playsinline ondblclick="enterFullscreen()"></video>
                <button id="fullscreen-btn" onclick="enterFullscreen()">⛶ FULLSCREEN</button>
                <div class="flex space-x-4 mt-6">
                    <button onclick="stopScreenShare()" class="bg-red-600 px-8 py-3 rounded-full font-black uppercase text-[10px] shadow-xl">TERMINATE SHARING</button>
                </div>
            </div>

            <div id="chatBox" class="flex-1 p-8 overflow-y-auto space-y-6 scroll-smooth"></div>

            <div id="video-grid">
                <p class="text-[8px] text-center opacity-30 font-black uppercase tracking-widest pb-1 border-b border-white/5">Local Cams</p>
            </div>
        </div>
    </div>

    <button onclick="toggleAIPanel()" class="fixed bottom-8 right-8 w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 text-white shadow-2xl flex items-center justify-center text-2xl hover:scale-110 transition z-[1001] border border-white/10 group">
        <i class="fas fa-robot group-hover:rotate-12 transition-transform"></i>
    </button>

    <div id="ai-panel">
        <div class="p-4 bg-indigo-900/50 border-b border-white/5 flex justify-between items-center">
            <span class="font-black italic uppercase tracking-widest text-[10px]">StudyAI Pro</span>
            <button onclick="toggleAIPanel()"><i class="fas fa-times text-slate-400"></i></button>
        </div>
        <div id="ai-messages" class="flex-1 p-5 overflow-y-auto space-y-4 text-[11px]">
            <div class="text-center text-slate-500 text-[10px] uppercase tracking-widest my-4 opacity-50">Assistant Ready</div>
        </div>
        <div class="p-3 m-3 bg-black/40 border border-white/10 rounded-2xl flex items-center space-x-2">
            <input id="ai-input" placeholder="Ask a professional question..." class="flex-1 bg-transparent outline-none px-2 text-[11px] text-white">
            <button onclick="askAI()" class="bg-indigo-600 w-8 h-8 rounded-xl flex items-center justify-center hover:bg-indigo-500 transition shadow-lg">
                <i class="fas fa-paper-plane text-white text-[10px]"></i>
            </button>
        </div>
    </div>

    <div id="whiteboardContainer">
        <div class="absolute top-6 right-6 flex space-x-4 z-50">
            <button onclick="resetBoard()" class="bg-red-500 text-white px-8 py-2 rounded-2xl font-black text-xs uppercase shadow-xl">Reset</button>
            <button onclick="toggleWhiteboard()" class="bg-slate-800 text-white px-8 py-2 rounded-2xl font-black text-xs uppercase">Close</button>
        </div>
        <canvas id="wbCanvas" class="w-full h-full cursor-crosshair"></canvas>
    </div>

    <form id="chatForm" class="p-8 bg-slate-900/95 border-t border-white/5 flex items-center space-x-6 z-20 shadow-2xl">
        <label class="cursor-pointer text-slate-400 hover:text-indigo-500 transition px-2">
            <i class="fas fa-paperclip text-lg"></i>
            <input type="file" class="hidden">
        </label>
        <input id="messageInput" placeholder="Send a message to everyone..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-[2rem] px-8 py-5 outline-none focus:border-indigo-500 transition text-sm">
        <button class="bg-indigo-600 px-12 py-5 rounded-[2rem] font-black italic uppercase tracking-widest text-white shadow-xl hover:scale-105 transition">SEND MESSAGE</button>
    </form>

    <script>
    const socket = io(); 
    const currentUser = localStorage.getItem('username'); 
    const currentRoom = new URLSearchParams(window.location.search).get('room');
    const myPeer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true }); 

    const videoGrid = document.getElementById('video-grid');
    const screenContainer = document.getElementById('screen-container');
    const screenVideo = document.getElementById('screen-video');
    const toast = document.getElementById('share-toast');

    let localStream = null;
    let screenStream = null;
    let isMicActive = true;
    let myVideoElement = null;

    socket.emit('join room', { username: currentUser, room: currentRoom });
    document.getElementById('roomTitle').textContent = currentRoom;

    function showToastNotification(msg) {
        document.getElementById('toast-msg').textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    let isDragging = false, startX, startY;
    videoGrid.onmousedown = (e) => { 
        if(e.target.tagName === 'VIDEO') return;
        isDragging = true; startX = e.clientX - videoGrid.offsetLeft; startY = e.clientY - videoGrid.offsetTop;
    };
    document.onmousemove = (e) => {
        if (isDragging) {
            videoGrid.style.left = (e.clientX - startX) + 'px';
            videoGrid.style.top = (e.clientY - startY) + 'px';
            videoGrid.style.right = 'auto';
        }
    };
    document.onmouseup = () => isDragging = false;

    myPeer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (incomingStream) => {
            if(call.metadata && call.metadata.type === 'screen') {
                screenContainer.style.display = 'flex';
                screenVideo.srcObject = incomingStream;
            } else {
                const existingVideo = document.getElementById('peer-' + call.peer);
                if(!existingVideo) {
                    const remoteVideo = document.createElement('video');
                    remoteVideo.id = 'peer-' + call.peer;
                    remoteVideo.className = "camera-stream";
                    remoteVideo.srcObject = incomingStream;
                    remoteVideo.play();
                    videoGrid.append(remoteVideo);
                }
            }
        });
    });

    socket.on('user-connected', (userId) => {
        if(localStream) connectToPeer(userId, localStream);
    });

    async function toggleCamera() {
        if(!localStream) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

                if(myVideoElement) {
                    myVideoElement.remove();
                    myVideoElement = null;
                }

                myVideoElement = document.createElement('video');
                myVideoElement.id = 'my-own-video';
                myVideoElement.muted = true;
                myVideoElement.className = "camera-stream";
                myVideoElement.srcObject = localStream;
                myVideoElement.play();
                videoGrid.append(myVideoElement);

                socket.emit('user-joined-media', { userId: myPeer.id, room: currentRoom });
                document.getElementById('vBtn').classList.add('bg-indigo-600');
                document.getElementById('vBtn').textContent = '📸 CAM ON';
            } catch (err) { 
                alert("Camera access denied."); 
            }
        } else {
            localStream.getTracks().forEach(track => track.stop());

            if(myVideoElement) {
                myVideoElement.remove();
                myVideoElement = null;
            }

            localStream = null;
            document.getElementById('vBtn').classList.remove('bg-indigo-600');
            document.getElementById('vBtn').textContent = '📸 CAMERA';
        }
    }

    function toggleMic() {
        if(!localStream) return;
        isMicActive = !isMicActive;
        localStream.getAudioTracks()[0].enabled = isMicActive;
        document.getElementById('mBtn').textContent = isMicActive ? "🎤 VOICE" : "🔇 MUTED";
        document.getElementById('mBtn').classList.toggle('bg-red-500', !isMicActive);
    }

    function connectToPeer(userId, stream) {
        const existingVideo = document.getElementById('peer-' + userId);
        if(existingVideo) return;

        const call = myPeer.call(userId, stream);
        const v = document.createElement('video');
        v.id = 'peer-' + userId;
        v.className = "camera-stream";
        call.on('stream', (incomingStream) => {
            v.srcObject = incomingStream; 
            v.play(); 
            videoGrid.append(v);
        });
    }

    async function startScreenShare() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            screenContainer.style.display = 'flex';
            screenVideo.srcObject = screenStream;
            socket.emit('screen-share-start', { user: currentUser, room: currentRoom });
            for(let id in myPeer.connections) {
                myPeer.call(id, screenStream, { metadata: { type: 'screen' } });
            }
            screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
        } catch (e) { console.error(e); }
    }

    function stopScreenShare() {
        if(screenStream) screenStream.getTracks().forEach(track => track.stop());
        screenContainer.style.display = 'none';
        screenVideo.srcObject = null;
        screenStream = null;
        socket.emit('screen-share-stop', { user: currentUser, room: currentRoom });
    }

    function enterFullscreen() {
        if(screenVideo.requestFullscreen) {
            screenVideo.requestFullscreen();
        } else if(screenVideo.webkitRequestFullscreen) {
            screenVideo.webkitRequestFullscreen();
        } else if(screenVideo.mozRequestFullScreen) {
            screenVideo.mozRequestFullScreen();
        } else if(screenVideo.msRequestFullscreen) {
            screenVideo.msRequestFullscreen();
        }
    }

    socket.on('notify-share-start', d => showToastNotification(`${d.user} is presenting their screen.`));
    socket.on('notify-share-stop', d => {
        showToastNotification(`${d.user} stopped presenting.`);
        screenContainer.style.display = 'none';
        screenVideo.srcObject = null;
    });

    function addMessageUI(data) {
        const isMe = data.user === currentUser;
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-6`;
        div.innerHTML = `
            <div class="${isMe ? 'bg-indigo-600 shadow-xl' : 'bg-slate-800'} p-5 rounded-2xl max-w-sm border border-white/5">
                <p class="text-[8px] font-black uppercase opacity-50 mb-1 tracking-widest">${data.user}</p>
                <p class="text-[13px] leading-relaxed">${data.msg}</p>
            </div>
        `;
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    socket.on('chat message', data => addMessageUI(data));
    socket.on('load history', history => history.forEach(addMessageUI));
    socket.on('update user list', users => {
        document.getElementById('userList').innerHTML = users.map(u => `
            <li class="flex items-center space-x-4 bg-white/5 p-4 rounded-2xl border border-white/5">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-black uppercase tracking-widest italic">${u.username}</span>
            </li>
        `).join('');
    });

    async function clearChat() {
        if(confirm("Permanently clear chat history?")) {
            await fetch(`/clear-chat/${currentRoom}`, { method: 'DELETE' });
            document.getElementById('chatBox').innerHTML = '';
        }
    }

    function toggleAIPanel() {
        document.getElementById('ai-panel').classList.toggle('ai-active');
    }

    async function askAI() {
        const input = document.getElementById('ai-input'), messages = document.getElementById('ai-messages');
        const query = input.value; if(!query) return;

        messages.innerHTML += `<div class="flex justify-end mb-3"><div class="bg-indigo-600 text-white px-4 py-2 rounded-2xl text-[11px] shadow-md max-w-[85%]">${query}</div></div>`;
        input.value = "Generating response...";
        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch('/ask-ai', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt: query }) });
            const data = await res.json();
            messages.innerHTML += `<div class="flex justify-start mb-4"><div class="bg-slate-800 border border-indigo-500/30 text-slate-200 px-4 py-3 rounded-2xl text-[11px] shadow-lg leading-relaxed max-w-[90%]"><i class="fas fa-magic text-indigo-400 mr-2"></i>${data.answer}</div></div>`;
        } catch (err) { messages.innerHTML += `<div class="text-red-400 text-[10px] text-center">AI Error.</div>`; }
        input.value = ""; messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById('ai-input').addEventListener('keydown', (e) => {
        if(e.key === 'Enter') askAI();
    });

    const canvas = document.getElementById('wbCanvas'); const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function toggleWhiteboard() {
        const wb = document.getElementById('whiteboardContainer');
        wb.style.display = wb.style.display === 'block' ? 'none' : 'block';
        if(wb.style.display === 'block') { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    }

    canvas.onmousedown = () => isDrawing = true;
    canvas.onmouseup = () => { isDrawing = false; ctx.beginPath(); };
    canvas.onmousemove = (e) => {
        if(!isDrawing) return;
        ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
    };

    function resetBoard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    document.getElementById('chatForm').onsubmit = (e) => {
        e.preventDefault();
        const msg = document.getElementById('messageInput').value;
        if(msg.trim()) { socket.emit('chat message', { user: currentUser, msg, room: currentRoom }); document.getElementById('messageInput').value = ''; }
    };
    </script>
</body>
</html>
