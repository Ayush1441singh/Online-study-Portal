<!DOCTYPE html>
<html>
<head>
    <title>StudyPortal Pro - Live Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-color: #0f172a; --accent-color: #6366f1; --glass: rgba(255, 255, 255, 0.03); }
        body { background: var(--bg-color); color: white; transition: 0.4s; font-family: sans-serif; overflow: hidden; }
        .glass-chat { background: var(--glass); backdrop-filter: blur(10px); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.05); }
        #video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        video { width: 100%; height: 110px; background: black; border-radius: 12px; border: 2px solid #6366f1; object-fit: cover; }
        #ai-btn { position: fixed; bottom: 25px; right: 25px; z-index: 1000; background: #6366f1; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        #ai-panel { display: none; position: fixed; bottom: 100px; right: 25px; width: 320px; height: 450px; background: #1e293b; border: 1px solid #6366f1; border-radius: 20px; flex-direction: column; z-index: 1000; overflow: hidden; }
        #whiteboardContainer { display: none; position: fixed; inset: 5%; background: white; z-index: 100; border-radius: 2rem; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        canvas { cursor: crosshair; width: 100%; height: 100%; }
    </style>
</head>
<body class="h-screen flex flex-col theme-midnight">

    <header class="p-4 bg-slate-900/80 flex justify-between items-center border-b border-white/5 z-10">
        <div class="flex items-center space-x-4">
            <button onclick="location.href='dashboard.html'" class="text-slate-400">← Back</button>
            <h2 id="roomTitle" class="text-lg font-black italic uppercase">ROOM</h2>
        </div>
        <div class="flex items-center space-x-2">
            <button id="vBtn" onclick="toggleVideo()" class="text-[10px] bg-blue-500/20 text-blue-400 border border-blue-400/20 px-3 py-1.5 rounded-full font-bold uppercase">📹 Video</button>
            <button id="micBtn" onclick="toggleMic()" class="text-[10px] bg-green-500/20 text-green-400 border border-green-400/20 px-3 py-1.5 rounded-full font-bold uppercase">🎤 Voice</button>
            <button onclick="startScreenShare()" class="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-400/20 px-3 py-1.5 rounded-full font-bold uppercase">🖥️ Share</button>
            <button onclick="toggleWhiteboard()" class="text-[10px] bg-purple-500/20 text-purple-400 border border-purple-400/20 px-3 py-1.5 rounded-full font-bold uppercase">🎨 Board</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <div class="w-64 bg-slate-900/50 p-6 border-r border-white/5 overflow-y-auto">
            <h3 class="text-[10px] font-black uppercase text-indigo-400 mb-6 italic">Classmates</h3>
            <ul id="userList" class="space-y-3"></ul>
        </div>
        <div id="chatBox" class="flex-1 p-8 overflow-y-auto space-y-6 flex flex-col"></div>
        <div id="video-grid" class="absolute top-4 right-4 w-60 pointer-events-none"></div>
    </div>

    <div id="ai-btn" onclick="toggleAI()">🤖</div>
    <div id="ai-panel">
        <div class="p-4 bg-indigo-600 font-bold flex justify-between"><span>StudyAI Assistant</span><button onclick="toggleAI()">×</button></div>
        <div id="ai-messages" class="flex-1 p-4 overflow-y-auto text-sm space-y-2 bg-slate-950"></div>
        <div class="p-3 border-t border-white/10 flex space-x-2">
            <input id="ai-input" placeholder="Ask AI..." class="flex-1 bg-white/5 p-2 rounded text-xs outline-none">
            <button onclick="askAI()" class="text-indigo-400 font-bold text-xs uppercase">Ask</button>
        </div>
    </div>

    <div id="whiteboardContainer">
        <div class="absolute top-4 right-4 z-20 flex space-x-2">
            <button onclick="clearWhiteboard()" class="bg-red-500 text-white px-4 py-1 rounded-full text-xs font-bold shadow-lg">Clear</button>
            <button onclick="toggleWhiteboard()" class="bg-slate-800 text-white px-4 py-1 rounded-full text-xs font-bold">Close</button>
        </div>
        <canvas id="wbCanvas"></canvas>
    </div>

    <div id="typingIndicator" class="px-6 py-1 text-[10px] italic text-indigo-400 h-4"></div>

    <form id="chatForm" class="p-6 bg-slate-900/90 border-t border-white/5 flex items-center space-x-4">
        <input type="file" id="fileInput" class="hidden">
        <button type="button" onclick="document.getElementById('fileInput').click()" class="text-2xl opacity-50 hover:opacity-100 transition">📎</button>
        <input id="messageInput" placeholder="Message friends..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none">
        <button class="bg-indigo-600 px-8 py-4 rounded-2xl font-black text-white">SEND</button>
    </form>

    <script>
    const socket = io();
    const username = localStorage.getItem('username');
    const room = new URLSearchParams(window.location.search).get('room');
    
    // --- 🛠️ PEERJS CLOUD FIX ---
    const myPeer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true }); 

    const videoGrid = document.getElementById('video-grid');
    let localStream, isVideoOn = false, isMicOn = false, typingTimeout;
    const peers = {};

    if(!username || !room) location.href = 'dashboard.html';
    else {
        document.getElementById('roomTitle').textContent = room;
        socket.emit('join room', { username, room });
    }

    // --- 📹 VIDEO & VOICE LOGIC ---
    myPeer.on('open', id => console.log('My Peer ID:', id));

    myPeer.on('call', call => {
        call.answer(localStream);
        const video = document.createElement('video');
        call.on('stream', userStream => addVideoStream(video, userStream));
    });

    socket.on('user-connected', userId => {
        if(localStream) connectToNewUser(userId, localStream);
    });

    async function toggleVideo() {
        if(!isVideoOn) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                if(!isMicOn) localStream.getAudioTracks()[0].enabled = false;
                
                const myVideo = document.createElement('video');
                myVideo.muted = true;
                addVideoStream(myVideo, localStream);

                socket.emit('user-joined-media', { userId: myPeer.id, room });

                isVideoOn = true;
                document.getElementById('vBtn').textContent = "📽️ ON";
            } catch (err) { alert("Please allow Camera/Mic access!"); }
        } else {
            localStream.getVideoTracks()[0].enabled = false;
            isVideoOn = false;
            document.getElementById('vBtn').textContent = "📹 Video";
        }
    }

    function toggleMic() {
        if(!localStream) return alert("Pehle Video ON karo!");
        isMicOn = !isMicOn;
        localStream.getAudioTracks()[0].enabled = isMicOn;
        document.getElementById('micBtn').textContent = isMicOn ? "🎙️ ON" : "🎤 Voice";
        document.getElementById('micBtn').classList.toggle('bg-green-600');
    }

    function connectToNewUser(userId, stream) {
        const call = myPeer.call(userId, stream);
        const video = document.createElement('video');
        call.on('stream', userStream => addVideoStream(video, userStream));
        call.on('close', () => video.remove());
        peers[userId] = call;
    }

    function addVideoStream(v, s) {
        v.srcObject = s;
        v.addEventListener('loadedmetadata', () => v.play());
        v.style.pointerEvents = "auto";
        videoGrid.append(v);
    }

    // --- 🖥️ SCREEN SHARE LOGIC ---
    async function startScreenShare() {
        try {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const video = document.createElement('video');
            addVideoStream(video, screenStream);
            socket.emit('user-joined-media', { userId: myPeer.id, room });
            screenStream.getVideoTracks()[0].onended = () => video.remove();
        } catch (err) { console.log("Share cancel"); }
    }

    // --- WHITEBOARD & CHAT ---
    const canvas = document.getElementById('wbCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    function toggleWhiteboard() {
        const wb = document.getElementById('whiteboardContainer');
        wb.style.display = wb.style.display === 'block' ? 'none' : 'block';
        if(wb.style.display === 'block') { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
    }
    canvas.onmousedown = () => drawing = true;
    canvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
    canvas.onmousemove = (e) => {
        if(!drawing) return;
        ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
        ctx.lineTo(e.clientX - canvas.offsetLeft - (window.innerWidth*0.05), e.clientY - canvas.offsetTop - (window.innerHeight*0.05));
        ctx.stroke();
    };
    function clearWhiteboard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    const messageInput = document.getElementById('messageInput');
    messageInput.addEventListener('keypress', () => {
        socket.emit('typing', { user: username, room: room });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => socket.emit('stop typing', { room: room }), 2000);
    });
    socket.on('display typing', d => document.getElementById('typingIndicator').textContent = `${d.user} is typing...`);
    socket.on('hide typing', () => document.getElementById('typingIndicator').textContent = '');

    socket.on('update user list', (users) => {
        document.getElementById('userList').innerHTML = users.map(u => `
            <li class="flex items-center space-x-3 text-sm font-bold bg-white/5 p-3 rounded-xl border border-white/5">
                <div class="w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_green] animate-pulse"></div>
                <span>${u.username}</span>
            </li>`).join('');
    });

    function append(data) {
        const isMe = data.user === username;
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} items-end space-x-3 mb-2`;
        div.innerHTML = `
            ${!isMe ? `<img src="https://ui-avatars.com/api/?name=${data.user}&background=random&color=fff&bold=true" class="w-8 h-8 rounded-full">` : ''}
            <div class="${isMe ? 'bg-indigo-600' : 'glass-chat'} p-4 rounded-2xl max-w-sm shadow-xl">
                <p class="text-[9px] font-black uppercase opacity-50 mb-1">${data.user}</p>
                <p class="text-sm">${data.msg}</p>
            </div>
            ${isMe ? `<img src="https://ui-avatars.com/api/?name=${data.user}&background=random&color=fff&bold=true" class="w-8 h-8 rounded-full">` : ''}
        `;
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    document.getElementById('chatForm').onsubmit = (e) => {
        e.preventDefault();
        if(messageInput.value.trim()) { socket.emit('chat message', { user: username, msg: messageInput.value, room: room }); messageInput.value = ''; }
    };
    socket.on('load history', msgs => msgs.forEach(append));
    socket.on('chat message', data => append(data));

    function toggleAI() { const p = document.getElementById('ai-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    async function askAI() {
        const input = document.getElementById('ai-input');
        const box = document.getElementById('ai-messages');
        const val = input.value; if(!val) return;
        box.innerHTML += `<div class="bg-indigo-600 p-2 rounded ml-8 mb-2 text-xs text-white">You: ${val}</div>`;
        input.value = "Thinking...";
        const res = await fetch('/ask-ai', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: val }) });
        const d = await res.json();
        box.innerHTML += `<div class="bg-slate-800 p-2 rounded mr-8 mb-2 text-xs text-indigo-300">AI: ${d.answer}</div>`;
        input.value = ""; box.scrollTop = box.scrollHeight;
    }
    document.getElementById('fileInput').onchange = async (e) => {
        const fd = new FormData(); fd.append('studyFile', e.target.files[0]);
        const res = await fetch('/upload', { method: 'POST', body: fd });
        const d = await res.json();
        socket.emit('chat message', { user: username, msg: `Shared: <a href="${d.filePath}" target="_blank" class="underline font-bold text-indigo-400">📄 ${d.fileName}</a>`, room: room });
    };
    </script>
</body>
</html>
