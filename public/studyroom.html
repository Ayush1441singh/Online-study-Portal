<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudyRoom Pro - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #0b0f1a; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Independent Screen View (Professional) */
        #screen-container { position: absolute; inset: 0; background: #000; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #screen-video { width: 92%; height: 82%; border-radius: 1.5rem; border: 1px solid #6366f1; box-shadow: 0 0 60px rgba(99, 102, 241, 0.25); }

        /* Draggable Camera Grid */
        #video-grid { position: absolute; top: 100px; right: 20px; width: 230px; z-index: 50; cursor: grab; background: rgba(0,0,0,0.5); padding: 12px; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 10px; }
        video.camera { width: 100%; border-radius: 1.2rem; border: 2px solid #6366f1; object-fit: cover; }

        /* Professional Notification Toast */
        #share-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #6366f1; padding: 1rem 2.5rem; border-radius: 3rem; z-index: 10000; transition: 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28); font-weight: 800; font-style: italic; box-shadow: 0 15px 35px rgba(99, 102, 241, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        #share-toast.show { top: 40px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="share-toast">📢 <span id="toast-msg">User is sharing screen...</span></div>

    <header class="p-4 bg-slate-900/90 flex justify-between items-center border-b border-white/5 z-20">
        <div class="flex items-center space-x-6">
            <button onclick="location.href='dashboard.html'" class="text-slate-400 hover:text-white transition font-bold uppercase tracking-widest text-[10px]">← Exit</button>
            <h2 id="roomTitle" class="font-black italic text-indigo-400 uppercase tracking-[0.3em] text-lg">ROOM</h2>
        </div>
        <div class="flex space-x-3">
            <button onclick="toggleVideo()" class="text-[10px] bg-white/5 px-6 py-2.5 rounded-full font-black uppercase tracking-widest hover:bg-indigo-600 transition">📸 CAMERA</button>
            <button onclick="startScreenShare()" class="text-[10px] bg-indigo-600 px-7 py-2.5 rounded-full font-black uppercase italic shadow-lg shadow-indigo-500/30 active:scale-95 transition">🖥️ SHARE SCREEN</button>
            <button onclick="stopScreenShare()" id="stop-btn" class="hidden text-[10px] bg-red-600 px-6 py-2.5 rounded-full font-black uppercase italic">🛑 STOP SHARE</button>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden">
        <div id="screen-container">
            <div class="mb-4 text-[10px] font-black text-indigo-400 uppercase tracking-[0.4em] bg-indigo-500/10 px-6 py-2.5 rounded-full border border-indigo-500/20 animate-pulse">LIVE SCREEN VIEW</div>
            <video id="screen-video" autoplay playsinline></video>
        </div>

        <div id="chatBox" class="flex-1 p-10 overflow-y-auto space-y-6 scroll-smooth"></div>
        
        <div id="video-grid">
            <p class="text-[8px] text-center opacity-30 font-black uppercase tracking-widest pb-1 border-b border-white/5">Local Cams</p>
        </div>
    </div>

    <form id="chatForm" class="p-8 bg-slate-900 border-t border-white/5 flex items-center space-x-6 z-20">
        <input id="messageInput" placeholder="Message your study buddies..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-2.5rem px-8 py-5 outline-none focus:border-indigo-500 transition shadow-inner text-sm">
        <button class="bg-indigo-600 px-12 py-5 rounded-2.5rem font-black italic uppercase tracking-widest text-white shadow-xl shadow-indigo-500/20 hover:scale-105 transition">Send</button>
    </form>

    <script>
    const socket = io();
    const username = localStorage.getItem('username');
    const room = new URLSearchParams(window.location.search).get('room');
    const myPeer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true }); 

    const videoGrid = document.getElementById('video-grid');
    const screenContainer = document.getElementById('screen-container');
    const screenVideo = document.getElementById('screen-video');
    const toast = document.getElementById('share-toast');
    const stopBtn = document.getElementById('stop-btn');

    let localStream, screenStream;
    let myVideo = document.createElement('video');
    myVideo.muted = true; myVideo.className = "camera";

    socket.emit('join room', { username, room });
    document.getElementById('roomTitle').textContent = room;

    // Toast Alert Professional
    function showToast(msg) {
        document.getElementById('toast-msg').textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // Draggable Handle
    let isDragging = false, offX, offY;
    videoGrid.onmousedown = e => { if(e.target.tagName === 'VIDEO') return; isDragging = true; offX = e.clientX - videoGrid.offsetLeft; offY = e.clientY - videoGrid.offsetTop; };
    document.onmousemove = e => { if (isDragging) { videoGrid.style.left = (e.clientX-offX)+'px'; videoGrid.style.top = (e.clientY-offY)+'px'; videoGrid.style.right='auto'; } };
    document.onmouseup = () => isDragging = false;

    // --- SCREEN SHARE (INDEPENDENT) ---
    async function startScreenShare() {
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            screenContainer.style.display = 'flex';
            screenVideo.srcObject = screenStream;
            stopBtn.classList.remove('hidden');

            socket.emit('screen-share-start', { user: username, room });

            // Send screen to all users separately
            for (let id in myPeer.connections) {
                myPeer.call(id, screenStream, { metadata: { type: 'screen' } });
            }

            screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
        } catch (e) { console.log("Cancelled"); }
    }

    function stopScreenShare() {
        if(screenStream) screenStream.getTracks().forEach(t => t.stop());
        screenContainer.style.display = 'none';
        stopBtn.classList.add('hidden');
        socket.emit('screen-share-stop', { user: username, room });
    }

    // --- PEER & CAMERA LOGIC ---
    myPeer.on('call', call => {
        call.answer(localStream); 
        call.on('stream', s => {
            if(call.metadata && call.metadata.type === 'screen') {
                screenContainer.style.display = 'flex';
                screenVideo.srcObject = s;
            } else {
                const v = document.createElement('video');
                v.className = "camera";
                v.srcObject = s; v.play();
                videoGrid.append(v);
            }
        });
    });

    socket.on('user-connected', userId => { if(localStream) connectToNewUser(userId, localStream); });

    async function toggleVideo() {
        if(!localStream) {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            myVideo.srcObject = localStream;
            myVideo.play();
            videoGrid.append(myVideo);
            socket.emit('user-joined-media', { userId: myPeer.id, room });
        } else {
            localStream.getTracks().forEach(t => t.stop());
            myVideo.remove(); localStream = null;
        }
    }

    function connectToNewUser(userId, stream) {
        const call = myPeer.call(userId, stream);
        const v = document.createElement('video');
        v.className = "camera";
        call.on('stream', userStream => { addVideoStream(v, userStream); });
    }

    function addVideoStream(v, s) { v.srcObject = s; v.onloadedmetadata = () => v.play(); videoGrid.append(v); }

    // --- SOCKET EVENTS ---
    socket.on('notify-share-start', d => showToast(`${d.user} NE SCREEN SHARE START KIYA!`));
    socket.on('notify-share-stop', d => { showToast(`${d.user} KA SCREEN SHARE KHATAM.`); screenContainer.style.display = 'none'; });

    socket.on('chat message', d => {
        const isMe = d.user === username;
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-6`;
        div.innerHTML = `<div class="${isMe ? 'bg-indigo-600 shadow-xl shadow-indigo-500/20' : 'bg-slate-800'} p-5 rounded-2xl max-w-sm border border-white/5"><p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-widest">${d.user}</p><p class="text-[13px] leading-relaxed">${d.msg}</p></div>`;
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    });

    document.getElementById('chatForm').onsubmit = e => {
        e.preventDefault();
        const msg = document.getElementById('messageInput').value;
        if(msg.trim()) { socket.emit('chat message', { user: username, msg, room }); document.getElementById('messageInput').value = ''; }
    };

    socket.on('update user list', u => {
        document.getElementById('userList').innerHTML = u.map(x => `<li class="flex items-center space-x-4 bg-white/5 p-4 rounded-2xl border border-white/5"><div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_green]"></div><span class="text-xs font-black uppercase tracking-widest italic">${x.username}</span></li>`).join('');
    });

    socket.on('load history', h => h.forEach(d => { /* chat logic logic logic */ }));
    </script>
</body>
</html>
