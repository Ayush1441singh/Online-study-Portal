<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudyRoom Pro - Live Session</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #0f172a; color: white; overflow: hidden; font-family: sans-serif; }
        #video-grid { 
            position: absolute; top: 100px; right: 20px; width: 240px; 
            z-index: 50; cursor: grab; background: rgba(0,0,0,0.4); 
            padding: 10px; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 10px;
        }
        video { width: 100%; height: 140px; border-radius: 1rem; border: 2px solid #6366f1; object-fit: cover; background: #000; }
        video:fullscreen { object-fit: contain; }
        #ai-panel { display: none; position: fixed; bottom: 100px; right: 25px; width: 320px; height: 450px; background: #1e293b; border: 1px solid #6366f1; border-radius: 20px; flex-direction: column; z-index: 1000; overflow: hidden; }
        #whiteboardContainer { display: none; position: fixed; inset: 5%; background: white; z-index: 100; border-radius: 2rem; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="p-4 bg-slate-900/90 flex justify-between items-center border-b border-white/5 z-10">
        <div class="flex items-center space-x-4">
            <button onclick="location.href='dashboard.html'" class="text-slate-400">← Exit</button>
            <h2 id="roomTitle" class="font-black italic text-indigo-400 uppercase tracking-widest">ROOM</h2>
        </div>
        <div class="flex space-x-2">
            <button onclick="toggleVideo()" class="text-[10px] bg-white/5 px-4 py-2 rounded-full font-bold hover:bg-indigo-600 transition">📹 VIDEO</button>
            <button onclick="startScreenShare()" class="text-[10px] bg-indigo-600 px-5 py-2 rounded-full font-black shadow-lg">🖥️ SHARE SCREEN</button>
            <button onclick="toggleWhiteboard()" class="text-[10px] bg-white/5 px-4 py-2 rounded-full font-bold">🎨 BOARD</button>
            <button onclick="clearChat()" class="text-[10px] bg-red-500/10 text-red-500 px-4 py-2 rounded-full font-bold border border-red-500/20">🗑️ CLEAR CHAT</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <div class="w-64 bg-slate-900/50 p-6 border-r border-white/5 overflow-y-auto">
            <p class="text-[10px] font-bold text-indigo-400 mb-4 uppercase">Online Classmates</p>
            <ul id="userList" class="space-y-2"></ul>
        </div>
        <div id="chatBox" class="flex-1 p-8 overflow-y-auto space-y-4"></div>
        <div id="video-grid" title="Hold to move me"><p class="text-center text-[8px] opacity-30 font-bold uppercase tracking-tighter">Draggable</p></div>
    </div>

    <div onclick="toggleAI()" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center cursor-pointer shadow-xl z-[1001] hover:scale-110 transition">🤖</div>

    <div id="ai-panel">
        <div class="p-4 bg-indigo-600 font-bold flex justify-between"><span>StudyAI</span><button onclick="toggleAI()">×</button></div>
        <div id="ai-messages" class="flex-1 p-4 overflow-y-auto text-xs space-y-2 bg-slate-950"></div>
        <div class="p-3 bg-slate-900 flex space-x-2">
            <input id="ai-input" placeholder="Ask AI..." class="flex-1 bg-white/5 p-2 rounded outline-none text-xs">
            <button onclick="askAI()" class="text-indigo-400 font-bold text-xs uppercase">Ask</button>
        </div>
    </div>

    <div id="whiteboardContainer">
        <div class="absolute top-4 right-4 flex space-x-2">
            <button onclick="clearWhiteboard()" class="bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-xs">Clear</button>
            <button onclick="toggleWhiteboard()" class="bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-xs">Close</button>
        </div>
        <canvas id="wbCanvas" class="w-full h-full"></canvas>
    </div>

    <form id="chatForm" class="p-6 bg-slate-900/95 border-t border-white/5 flex items-center space-x-4">
        <input id="messageInput" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 outline-none focus:border-indigo-500 transition">
        <button class="bg-indigo-600 px-8 py-4 rounded-2xl font-black text-white hover:bg-indigo-500 transition">SEND</button>
    </form>

    <script>
    const socket = io();
    const username = localStorage.getItem('username');
    const room = new URLSearchParams(window.location.search).get('room');
    const myPeer = new Peer(undefined, { host: '0.peerjs.com', port: 443, secure: true }); 

    const videoGrid = document.getElementById('video-grid');
    let localStream, isVideoOn = false, myVideo = document.createElement('video');
    myVideo.muted = true; myVideo.id = "my-local-camera";

    if(!username || !room) location.href = 'dashboard.html';
    else { document.getElementById('roomTitle').textContent = room; socket.emit('join room', { username, room }); }

    // Draggable Logic
    let isDragging = false, offX, offY;
    videoGrid.onmousedown = e => { if(e.target.tagName === 'VIDEO') return; isDragging = true; offX = e.clientX - videoGrid.offsetLeft; offY = e.clientY - videoGrid.offsetTop; };
    document.onmousemove = e => { if (!isDragging) return; videoGrid.style.left = (e.clientX - offX) + 'px'; videoGrid.style.top = (e.clientY - offY) + 'px'; videoGrid.style.right = 'auto'; };
    document.onmouseup = () => isDragging = false;

    // Media Handling
    myPeer.on('call', call => {
        call.answer(localStream);
        const video = document.createElement('video');
        video.id = call.peer;
        call.on('stream', s => { if(!document.getElementById(call.peer)) addVideoStream(video, s); });
    });

    socket.on('user-connected', userId => { if(localStream) connectToNewUser(userId, localStream); });

    async function toggleVideo() {
        if(!isVideoOn) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                myVideo.srcObject = localStream;
                if(!document.getElementById('my-local-camera')) addVideoStream(myVideo, localStream);
                socket.emit('user-joined-media', { userId: myPeer.id, room });
                isVideoOn = true;
            } catch (err) { alert("Camera access denied!"); }
        } else {
            localStream.getTracks().forEach(t => t.stop());
            myVideo.remove(); isVideoOn = false;
        }
    }

    function addVideoStream(v, s) {
        v.srcObject = s; v.onloadedmetadata = () => v.play();
        v.ondblclick = () => { if(v.requestFullscreen) v.requestFullscreen(); };
        videoGrid.append(v);
    }

    function connectToNewUser(userId, stream) {
        const call = myPeer.call(userId, stream);
        const video = document.createElement('video');
        video.id = userId;
        call.on('stream', s => { if(!document.getElementById(userId)) addVideoStream(video, s); });
        call.on('close', () => video.remove());
    }

    // Screen Share Logic
    async function startScreenShare() {
        try {
            alert("Bhai, 'Share System Audio' tick karna mat bhoolna!");
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const vTrack = screenStream.getVideoTracks()[0];

            socket.emit('screen-share-start', { user: username, room });
            myVideo.srcObject = screenStream;

            vTrack.onended = () => {
                socket.emit('screen-share-stop', { user: username, room });
                location.reload();
            };
        } catch (e) { console.log("Share cancel"); }
    }

    socket.on('notify-share-start', d => alert(`ALERT: ${d.user} ne Screen Share shuru kiya!`));
    socket.on('notify-share-stop', d => alert(`${d.user} ka Screen Share khatam.`));

    // Chat & User List
    socket.on('update user list', (users) => {
        document.getElementById('userList').innerHTML = users.map(u => `<li class="text-[10px] font-bold bg-white/5 p-2 rounded-lg">● ${u.username}</li>`).join('');
    });

    function appendMsg(data) {
        const isMe = data.user === username;
        const div = document.createElement('div');
        div.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-2`;
        div.innerHTML = `<div class="${isMe ? 'bg-indigo-600' : 'bg-slate-800'} p-3 rounded-2xl max-w-xs text-xs"><b>${data.user}:</b><br>${data.msg}</div>`;
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    document.getElementById('chatForm').onsubmit = (e) => {
        e.preventDefault();
        const msg = document.getElementById('messageInput').value;
        if(msg) { socket.emit('chat message', { user: username, msg, room }); document.getElementById('messageInput').value = ''; }
    };
    socket.on('chat message', data => appendMsg(data));
    socket.on('load history', h => h.forEach(appendMsg));

    async function clearChat() {
        if(confirm("Clear chat?")) { await fetch(`/clear-chat/${room}`, { method: 'DELETE' }); document.getElementById('chatBox').innerHTML = ''; }
    }

    // AI & Whiteboard (Simplified for performance)
    function toggleAI() { const p = document.getElementById('ai-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    async function askAI() {
        const input = document.getElementById('ai-input');
        const box = document.getElementById('ai-messages');
        const val = input.value; if(!val) return;
        box.innerHTML += `<div class="mb-2 italic opacity-50">You: ${val}</div>`;
        input.value = "Thinking...";
        const res = await fetch('/ask-ai', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt: val }) });
        const d = await res.json();
        box.innerHTML += `<div class="mb-4 text-indigo-400">AI: ${d.answer}</div>`;
        input.value = ""; box.scrollTop = box.scrollHeight;
    }

    const canvas = document.getElementById('wbCanvas'); const ctx = canvas.getContext('2d');
    let drawing = false;
    function toggleWhiteboard() { const w = document.getElementById('whiteboardContainer'); w.style.display = w.style.display === 'block' ? 'none' : 'block'; if(w.style.display==='block'){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;} }
    canvas.onmousedown = () => drawing = true; canvas.onmouseup = () => {drawing=false; ctx.beginPath();};
    canvas.onmousemove = e => { if(drawing){ctx.lineWidth=2; ctx.lineTo(e.clientX-canvas.offsetLeft-(window.innerWidth*0.05), e.clientY-canvas.offsetTop-(window.innerHeight*0.05)); ctx.stroke();} };
    function clearWhiteboard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    </script>
</body>
</html>
