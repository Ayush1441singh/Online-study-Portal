<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudyPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-md p-10 rounded-[2.5rem] shadow-2xl">
        <h1 class="text-3xl font-black italic text-center text-indigo-500 mb-4 uppercase">StudyPortal</h1>
        <p class="text-center text-xs uppercase tracking-[0.25em] text-slate-500 font-bold mb-10">Password + Email OTP</p>
        <form id="loginForm" class="space-y-6">
            <input id="email" type="email" required placeholder="Email Address" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500">
            <input id="password" type="password" required placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500">
            <button id="loginButton" type="submit" class="w-full bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl">Send OTP</button>
        </form>
        <div class="mt-4">
            <button id="passkeyButton" type="button" class="w-full border border-indigo-400/30 bg-indigo-500/10 py-4 rounded-2xl font-black uppercase text-xs tracking-widest text-indigo-200">Sign In With Passkey</button>
        </div>
        <p id="statusMessage" class="hidden mt-5 text-center text-xs font-bold uppercase tracking-widest"></p>
        <p class="mt-4 text-center text-[11px] text-slate-500">Passkey can use your device PIN, fingerprint, Face ID, or phone approval on supported mobile browsers.</p>
        <p class="text-center mt-8 text-xs text-slate-500 font-bold uppercase tracking-widest">
            New here? <a href="/registers.html" class="text-indigo-400">Create Account</a>
        </p>
    </div>
    <script>
        const form = document.getElementById('loginForm');
        const button = document.getElementById('loginButton');
        const passkeyButton = document.getElementById('passkeyButton');
        const statusMessage = document.getElementById('statusMessage');
        const OTP_REQUEST_TIMEOUT_MS = 20000;

        function base64UrlToBytes(value) {
            const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
            const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
            return Uint8Array.from(atob(padded), (char) => char.charCodeAt(0));
        }

        function bytesToBase64Url(value) {
            const bytes = value instanceof ArrayBuffer ? new Uint8Array(value) : new Uint8Array(value.buffer || value);
            let binary = '';
            bytes.forEach((byte) => {
                binary += String.fromCharCode(byte);
            });
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        }

        function normalizeCredentialOptions(publicKey) {
            return {
                ...publicKey,
                challenge: base64UrlToBytes(publicKey.challenge),
                allowCredentials: (publicKey.allowCredentials || []).map((item) => ({
                    ...item,
                    id: base64UrlToBytes(item.id)
                }))
            };
        }

        function serializeAssertion(credential) {
            return {
                id: credential.id,
                rawId: bytesToBase64Url(credential.rawId),
                type: credential.type,
                response: {
                    clientDataJSON: bytesToBase64Url(credential.response.clientDataJSON),
                    authenticatorData: bytesToBase64Url(credential.response.authenticatorData),
                    signature: bytesToBase64Url(credential.response.signature),
                    userHandle: credential.response.userHandle ? bytesToBase64Url(credential.response.userHandle) : null
                }
            };
        }

        function showStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.className = `mt-5 text-center text-xs font-bold uppercase tracking-widest ${isError ? 'text-red-400' : 'text-emerald-400'}`;
        }

        async function fetchJsonWithTimeout(url, options, timeoutMs) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);

            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                const data = await response.json();
                return { response, data };
            } finally {
                clearTimeout(timer);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            button.disabled = true;
            button.textContent = 'Sending OTP...';
            showStatus('Checking credentials...');

            try {
                const { response: res, data } = await fetchJsonWithTimeout('/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                }, OTP_REQUEST_TIMEOUT_MS);

                if (!res.ok || !data.success) {
                    throw new Error(data.message || 'Login failed.');
                }

                sessionStorage.setItem('otp_email_hint', document.getElementById('email').value);
                if (data.otpPreview) {
                    sessionStorage.setItem('otp_preview', data.otpPreview);
                } else {
                    sessionStorage.removeItem('otp_preview');
                }

                showStatus('OTP sent. Redirecting to verification...');
                window.location.href = '/otp-check.html';
            } catch (error) {
                if (error.name === 'AbortError') {
                    showStatus('OTP request timed out. Please check your email settings and try again.', true);
                } else {
                    showStatus(error.message || 'Authentication failed.', true);
                }
            } finally {
                button.disabled = false;
                button.textContent = 'Send OTP';
            }
        });

        passkeyButton.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();

            if (!email) {
                showStatus('Enter your email first for passkey sign-in.', true);
                return;
            }

            if (!window.PublicKeyCredential || !navigator.credentials) {
                showStatus('This browser does not support passkeys.', true);
                return;
            }

            passkeyButton.disabled = true;
            passkeyButton.textContent = 'Opening Passkey...';
            showStatus('Checking saved passkey...');

            try {
                const optionsResponse = await fetch('/passkey/auth/options', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const optionsData = await optionsResponse.json();
                if (!optionsResponse.ok || !optionsData.success) {
                    throw new Error(optionsData.message || 'Could not start passkey sign-in.');
                }

                const credential = await navigator.credentials.get({
                    publicKey: normalizeCredentialOptions(optionsData.publicKey)
                });

                if (!credential) {
                    throw new Error('Passkey request was cancelled.');
                }

                showStatus('Verifying passkey...');
                const verifyResponse = await fetch('/passkey/auth/verify', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        credential: serializeAssertion(credential)
                    })
                });
                const verifyData = await verifyResponse.json();
                if (!verifyResponse.ok || !verifyData.success) {
                    throw new Error(verifyData.message || 'Passkey verification failed.');
                }

                showStatus('Passkey verified. Opening dashboard...');
                window.location.href = '/dashboard.html';
            } catch (error) {
                showStatus(error.message || 'Passkey sign-in failed.', true);
            } finally {
                passkeyButton.disabled = false;
                passkeyButton.textContent = 'Sign In With Passkey';
            }
        });
    </script>
</body>
</html>
