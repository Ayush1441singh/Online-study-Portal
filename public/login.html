<!DOCTYPE html>
<html>
<head>
    <title>Login - StudyPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-md p-10 rounded-[2.5rem] shadow-2xl">
        <h1 class="text-3xl font-black italic text-center mb-10 uppercase">STUDY<span class="text-indigo-500">PORTAL</span></h1>
        <form id="loginForm" class="space-y-6">
            <input id="email" type="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500 transition">
            <input id="password" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-indigo-500 transition">
            <button class="w-full bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs">Login</button>
        </form>
        <p class="text-center mt-6 text-xs opacity-50">Naye ho? <a href="register.html" class="text-indigo-400 font-bold">Register Karo</a></p>
    </div>
    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.success) {
                localStorage.setItem('username', data.username);
                localStorage.setItem('userEmail', data.email); // 👈 Critical Fix
                window.location.href = 'dashboard.html';
            } else { alert(data.message); }
        };
    </script>
</body>
</html>
