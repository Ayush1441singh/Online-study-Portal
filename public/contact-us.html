<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - StudyPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass w-full max-w-2xl p-10 rounded-[2.5rem] shadow-2xl">
        <h1 class="text-4xl font-black italic text-center text-indigo-500 mb-4 uppercase">Contact Us</h1>
        <p class="text-center text-slate-300 text-sm leading-7 max-w-xl mx-auto">
            Need help with StudyPortal? Reach out to our support team and we will get back to you as soon as possible.
        </p>

        <div class="mt-10 grid gap-6 md:grid-cols-2">
            <div class="rounded-3xl border border-white/10 bg-white/5 p-6">
                <p class="text-xs font-bold uppercase tracking-[0.25em] text-slate-500">Email</p>
                <p class="mt-3 text-lg font-semibold text-white">support@studyportal.com</p>
            </div>
            <div class="rounded-3xl border border-white/10 bg-white/5 p-6">
                <p class="text-xs font-bold uppercase tracking-[0.25em] text-slate-500">Phone</p>
                <p class="mt-3 text-lg font-semibold text-white">+91 98765 43210</p>
            </div>
        </div>

        <div class="mt-6 rounded-3xl border border-white/10 bg-white/5 p-6">
            <p class="text-xs font-bold uppercase tracking-[0.25em] text-slate-500">Office Hours</p>
            <p class="mt-3 text-base text-slate-200">Monday to Saturday, 9:00 AM to 6:00 PM</p>
        </div>
    </div>
</body>
</html>
