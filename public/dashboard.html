<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - StudyPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 2rem; transition: 0.3s; }
        .glass-card:hover { transform: translateY(-5px); border-color: #6366f1; }
        #editModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body class="p-8">

    <header class="max-w-6xl mx-auto flex justify-between items-center mb-12">
        <h1 class="text-3xl font-black italic tracking-tighter uppercase">STUDY<span class="text-indigo-500">PORTAL</span></h1>
        <button onclick="logout()" class="bg-red-500/10 text-red-500 px-6 py-2 rounded-full text-xs font-bold border border-red-500/20">Logout</button>
    </header>

    <main class="max-w-6xl mx-auto space-y-8">
        <div class="glass-card p-10 flex items-center space-x-10 relative overflow-hidden">
            <div class="relative flex-shrink-0">
                <img id="profileImg" src="" class="w-36 h-36 rounded-[2.5rem] object-cover border-4 border-indigo-500/20 shadow-2xl">
                <button onclick="openModal()" class="absolute -bottom-2 -right-2 bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center border-4 border-[#0f172a] hover:scale-110 transition-all shadow-xl">
                    <i class="fas fa-pencil-alt text-white"></i>
                </button>
            </div>
            <div class="flex-1">
                <h2 id="welcomeText" class="text-5xl font-black italic mb-2 tracking-tight">Loading...</h2>
                <p id="bioText" class="text-slate-400 text-lg italic mb-4">"Vibe check..."</p>
                <p id="emailDisp" class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div onclick="joinRoom('Calculus')" class="glass-card p-12 group cursor-pointer h-72 flex flex-col justify-between">
                <div>
                    <h3 class="text-3xl font-black italic group-hover:text-indigo-400 transition uppercase">Calculus Room</h3>
                    <p class="text-slate-500 mt-2 font-medium">Secure Entry. Password sent to your email.</p>
                </div>
                <button class="bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs italic tracking-widest">Request Access</button>
            </div>
            <div onclick="joinRoom('Java')" class="glass-card p-12 group cursor-pointer h-72 flex flex-col justify-between">
                <div>
                    <h3 class="text-3xl font-black italic group-hover:text-indigo-400 transition uppercase">Java Masters</h3>
                    <p class="text-slate-500 mt-2 font-medium">OOPs hub. Access code via email.</p>
                </div>
                <button class="bg-indigo-600 py-4 rounded-2xl font-black uppercase text-xs italic tracking-widest">Request Access</button>
            </div>
        </div>
    </main>

    <div id="editModal">
        <div class="bg-slate-900 p-10 rounded-[2.5rem] border border-indigo-500 w-96 shadow-2xl">
            <h3 class="text-xl font-black mb-6 italic uppercase text-center">Update Profile</h3>
            <div class="space-y-4">
                <input id="newBio" placeholder="Enter new bio..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-indigo-500 transition">
                <input id="newPic" placeholder="New Profile Image URL..." class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl text-sm outline-none focus:border-indigo-500 transition">
            </div>
            <div class="flex space-x-3 mt-8">
                <button onclick="closeModal()" class="flex-1 text-xs font-bold opacity-50 uppercase tracking-widest">Cancel</button>
                <button onclick="saveProfile()" class="flex-1 bg-indigo-600 py-4 rounded-2xl text-xs font-bold uppercase tracking-widest">Save</button>
            </div>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('username') || "User";
        const userEmail = localStorage.getItem('userEmail') || "No Email";

        document.getElementById('welcomeText').textContent = `Hello, ${username}!`;
        document.getElementById('emailDisp').textContent = userEmail;
        document.getElementById('profileImg').src = localStorage.getItem('userPic') || `https://ui-avatars.com/api/?name=${username}&background=6366f1&color=fff&size=200&bold=true`;
        document.getElementById('bioText').textContent = `"${localStorage.getItem('userBio') || "Let's study together!"}"`;

        function openModal() { document.getElementById('editModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        
        function saveProfile() {
            const bio = document.getElementById('newBio').value;
            const pic = document.getElementById('newPic').value;
            if(bio) { localStorage.setItem('userBio', bio); document.getElementById('bioText').textContent = `"${bio}"`; }
            if(pic) { localStorage.setItem('userPic', pic); document.getElementById('profileImg').src = pic; }
            closeModal();
        }

        async function joinRoom(room) {
            if(userEmail === "No Email") return alert("Pehle login karo!");
            alert("Bhai, password teri email pe bhej rahe hain. Check kar!");
            
            try {
                await fetch('/send-room-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: userEmail, room })
                });
                
                const pass = prompt(`Enter password sent to ${userEmail}:`);
                if(!pass) return;

                const res = await fetch('/verify-room', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ room, password: pass })
                });
                const data = await res.json();

                if(data.success) {
                    window.location.href = `studyroom.html?room=${room}`;
                } else {
                    alert("Galat password hai bhai!");
                }
            } catch (err) { alert("Server error!"); }
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    </script>
</body>
</html>
