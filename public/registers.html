<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Portal - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Join Study Portal</h2>
        
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition duration-300">
                Create Account
            </button>
        </form>

        <p id="message" class="mt-4 text-center text-sm font-semibold"></p>
        <p class="mt-4 text-center text-sm text-gray-600">Already have an account? <a href="/login.html" class="text-blue-600 hover:underline">Log in</a></p>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const messageDisplay = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop the page from reloading

            // Grab the data from the input fields
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Send the data to your Node.js backend
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                // Show success or error messages
                if (response.status === 201) {
                    messageDisplay.style.color = 'green';
                    messageDisplay.textContent = 'Account created successfully! Welcome!';
                    form.reset(); // Clear the form
                } else {
                    messageDisplay.style.color = 'red';
                    messageDisplay.textContent = data.message || data.error;
                }
            } catch (err) {
                messageDisplay.style.color = 'red';
                messageDisplay.textContent = 'Server error. Try again later.';
            }
        });
    </script>
</body>
</html>
