<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Performance Predictor | StudyPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 p-5 text-slate-100 md:p-10">
    <main class="mx-auto max-w-3xl">
        <a href="/dashboard.html" class="text-sm text-cyan-300 hover:text-cyan-100">← Back to dashboard</a>
        <section class="mt-6 rounded-3xl border border-cyan-400/20 bg-slate-900 p-6 shadow-2xl md:p-9">
            <p class="text-xs font-bold uppercase tracking-[0.25em] text-cyan-300">AIML Module</p>
            <h1 class="mt-3 text-3xl font-extrabold">Student Performance Predictor</h1>
            <p class="mt-3 text-slate-300">Enter learning habits to predict performance using a supervised K-Nearest Neighbors model.</p>
            <form id="predictForm" class="mt-7 grid gap-5 sm:grid-cols-2">
                <label>Weekly study hours<input name="studyHours" type="number" min="0" max="80" step="0.5" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-800 p-3"></label>
                <label>Attendance (%)<input name="attendance" type="number" min="0" max="100" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-800 p-3"></label>
                <label>Previous score (%)<input name="previousScore" type="number" min="0" max="100" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-800 p-3"></label>
                <label>Assignment score (%)<input name="assignmentScore" type="number" min="0" max="100" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-800 p-3"></label>
                <label>Average sleep hours<input name="sleepHours" type="number" min="0" max="24" step="0.5" required class="mt-2 w-full rounded-xl border border-slate-600 bg-slate-800 p-3"></label>
                <button class="self-end rounded-xl bg-cyan-400 p-3 font-bold text-slate-950 hover:bg-cyan-300">Predict Performance</button>
            </form>
            <section id="result" class="mt-7 hidden rounded-2xl border border-cyan-400/20 bg-slate-800/70 p-5" aria-live="polite"></section>
        </section>
    </main>
    <script>
        const form = document.getElementById('predictForm');
        const result = document.getElementById('result');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const payload = Object.fromEntries(new FormData(form).entries());
            const response = await fetch('/api/ml/predict-performance', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
            });
            const data = await response.json();
            result.classList.remove('hidden');
            if (!response.ok) { result.textContent = data.message || 'Prediction failed.'; return; }
            result.innerHTML = `<p class="text-xs font-bold uppercase tracking-widest text-cyan-300">Prediction</p><h2 class="mt-2 text-3xl font-extrabold">${data.prediction}</h2><p class="mt-2 text-slate-300">Confidence: ${data.confidence}% · ${data.algorithm} · ${data.trainingSamples} training samples</p><h3 class="mt-5 font-bold">Recommended actions</h3><ul class="mt-2 list-disc space-y-1 pl-5 text-slate-300">${data.recommendations.map((item) => `<li>${item}</li>`).join('')}</ul>`;
        });
    </script>
</body>
</html>
